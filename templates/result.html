<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="card">
    {% if success %}
        <h2>Analysis Complete</h2>
        <a href="/download/{{ session_id }}/{{ combined_log }}">Download combined.log</a>
        <a href="/download/{{ session_id }}/{{ summary_log }}">Download summary.log</a>
    {% else %}
        <h2>Error</h2>
        <p>{{ error }}</p>
    {% endif %}
    <br>
    <a href="/">Back</a>
</div>
</body>
</html>
