<!DOCTYPE html>
<html>
<head>
    <title>Nginx Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="card">
    <h2>Nginx Log Analyzer</h2>
    <form method="post">
        <label>Base URL</label>
        <input type="text" name="base_url" required value="{{ base_url or '' }}">

        <label>Token (optional)</label>
        <input type="text" name="token" value="{{ token or '' }}">

        <label>Start Time</label>
        <input type="text" name="start_time" value="{{ default_start }}" placeholder="YYYY/MM/DD HH:MM:SS">

        <label>End Time</label>
        <input type="text" name="end_time" value="{{ default_end }}" placeholder="YYYY/MM/DD HH:MM:SS">

        <button type="submit">Analyze</button>
    </form>
</div>
</body>
</html>
